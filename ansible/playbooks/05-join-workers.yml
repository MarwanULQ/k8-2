---
# The join command is generated and used inside this one file so it can be
# re-run on its own (facts do not persist between separate ansible-playbook runs).
- name: Generate a join command on the control plane
  hosts: control_plane
  become: true
  gather_facts: false
  tasks:
    - name: Create join command
      ansible.builtin.command: kubeadm token create --print-join-command
      register: join_cmd
      changed_when: false

    - name: Keep it as a fact
      ansible.builtin.set_fact:
        kubeadm_join_command: "{{ join_cmd.stdout }}"

- name: Join workers
  hosts: workers
  become: true
  gather_facts: false
  tasks:
    - name: kubeadm join (skipped if already joined)
      ansible.builtin.command: >-
        {{ hostvars[groups['control_plane'][0]].kubeadm_join_command }}
        --cri-socket={{ containerd_socket }}
        --node-name={{ node_name }}
      args:
        creates: /etc/kubernetes/kubelet.conf
