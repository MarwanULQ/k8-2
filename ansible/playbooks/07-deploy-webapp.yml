---
- name: Deploy Flask webapp
  hosts: control_plane
  become: true
  gather_facts: false
  vars:
    app_image: "{{ lookup('env', 'APP_IMAGE') }}"
    ghcr_username: "{{ lookup('env', 'GHCR_USERNAME') }}"
    ghcr_read_token: "{{ lookup('env', 'GHCR_READ_TOKEN') }}"
    manifest_path: /tmp/flask-webapp.yaml
  tasks:
    - name: Require image and GHCR credentials
      ansible.builtin.assert:
        that:
          - app_image | length > 0
          - ghcr_username | length > 0
          - ghcr_read_token | length > 0

    - name: Render Kubernetes manifest
      ansible.builtin.copy:
        content: >-
          {{ lookup('file', playbook_dir + '/../../k8s/deployment.yaml')
             | replace('__IMAGE__', app_image) }}
        dest: "{{ manifest_path }}"
        mode: "0644"

    - name: Create or update GHCR pull secret
      ansible.builtin.shell: >-
        kubectl create secret docker-registry ghcr-pull-secret
        --docker-server=ghcr.io
        --docker-username={{ ghcr_username | quote }}
        --docker-password={{ ghcr_read_token | quote }}
        --dry-run=client -o yaml |
        kubectl apply -f -
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      no_log: true
      changed_when: true

    - name: Apply Flask webapp
      ansible.builtin.command:
        argv:
          - kubectl
          - apply
          - -f
          - "{{ manifest_path }}"
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Wait for Flask webapp rollout
      ansible.builtin.command:
        argv:
          - kubectl
          - rollout
          - status
          - deployment/flask-webapp
          - --timeout=180s
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
