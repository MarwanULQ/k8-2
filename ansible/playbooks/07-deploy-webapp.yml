---
- name: Deploy Library Task 1
  hosts: control_plane
  become: true
  gather_facts: false
  vars:
    app_image: "{{ lookup('env', 'APP_IMAGE') }}"
    ghcr_username: "{{ lookup('env', 'GHCR_USERNAME') }}"
    ghcr_read_token: "{{ lookup('env', 'GHCR_READ_TOKEN') }}"
    postgres_password: "{{ lookup('env', 'POSTGRES_PASSWORD') }}"
    secret_key: "{{ lookup('env', 'SECRET_KEY') }}"
    manifest_dir: /tmp/library-manifests
  tasks:
    - name: Require deployment values
      ansible.builtin.assert:
        that:
          - app_image | length > 0
          - ghcr_username | length > 0
          - ghcr_read_token | length > 0
          - postgres_password | length >= 16
          - secret_key | length >= 32
    - name: Create manifest directory
      ansible.builtin.file: {path: "{{ manifest_dir }}", state: directory, mode: "0700"}
    - name: Render manifests
      ansible.builtin.copy:
        content: "{{ lookup('file', playbook_dir + '/../../k8s/' + item.source) | replace('__IMAGE__', app_image) }}"
        dest: "{{ manifest_dir }}/{{ item.dest }}"
        mode: "0600"
      loop:
        - {source: namespace.yaml, dest: namespace.yaml}
        - {source: configmap.yaml, dest: configmap.yaml}
        - {source: postgres.yaml, dest: postgres.yaml}
        - {source: migrate-job.yaml, dest: migrate-job.yaml}
        - {source: deployment.yaml, dest: deployment.yaml}
    - name: Render secret manifest
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../k8s/secret.yaml.j2"
        dest: "{{ manifest_dir }}/secret.yaml"
        mode: "0600"
    - name: Apply base resources
      ansible.builtin.command: kubectl apply -f {{ item }}
      environment: {KUBECONFIG: /etc/kubernetes/admin.conf}
      loop:
        - "{{ manifest_dir }}/namespace.yaml"
        - "{{ manifest_dir }}/configmap.yaml"
        - "{{ manifest_dir }}/secret.yaml"
    - name: Apply PostgreSQL
      ansible.builtin.command: kubectl apply -f {{ manifest_dir }}/postgres.yaml
      environment: {KUBECONFIG: /etc/kubernetes/admin.conf}
    - name: Wait for PostgreSQL
      ansible.builtin.command: kubectl wait --for=condition=ready pod -l app=postgres -n library --timeout=180s
      environment: {KUBECONFIG: /etc/kubernetes/admin.conf}
      changed_when: false
    - name: Create or update GHCR pull secret
      ansible.builtin.shell: >-
        kubectl create secret docker-registry ghcr-pull-secret --namespace library
        --docker-server=ghcr.io --docker-username={{ ghcr_username | quote }}
        --docker-password={{ ghcr_read_token | quote }} --dry-run=client -o yaml | kubectl apply -f -
      environment: {KUBECONFIG: /etc/kubernetes/admin.conf}
      no_log: true
      changed_when: true
    - name: Run database migration
      ansible.builtin.shell: >-
        kubectl delete job/library-migrate -n library --ignore-not-found=true
        && kubectl apply -f {{ manifest_dir }}/migrate-job.yaml
      environment: {KUBECONFIG: /etc/kubernetes/admin.conf}
      changed_when: true
    - name: Wait for database migration
      ansible.builtin.command: kubectl wait --for=condition=complete job/library-migrate -n library --timeout=180s
      environment: {KUBECONFIG: /etc/kubernetes/admin.conf}
      changed_when: false
    - name: Apply webapp
      ansible.builtin.command: kubectl apply -f {{ manifest_dir }}/deployment.yaml
      environment: {KUBECONFIG: /etc/kubernetes/admin.conf}
    - name: Wait for webapp rollout
      ansible.builtin.command: kubectl rollout status deployment/flask-webapp -n library --timeout=180s
      environment: {KUBECONFIG: /etc/kubernetes/admin.conf}
      changed_when: false
