---
- import_playbook: 06c-install-argocd.yml

- name: Bootstrap Argo CD GitOps
  hosts: control_plane
  become: true
  gather_facts: false
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    - name: Require bootstrap credentials
      ansible.builtin.assert:
        that:
          - lookup('env', item) | length > 0
      loop: [POSTGRES_PASSWORD, SECRET_KEY, GHCR_USERNAME, GHCR_READ_TOKEN]
      no_log: true

    - name: Ensure Library namespace exists
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: '{"apiVersion":"v1","kind":"Namespace","metadata":{"name":"library"}}'

    - name: Ensure monitoring namespace exists
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: '{"apiVersion":"v1","kind":"Namespace","metadata":{"name":"monitoring"}}'

    - name: Apply bootstrap Secrets without writing credentials to disk
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: "{{ item | to_json }}"
      loop:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: grafana-admin
            namespace: monitoring
          type: Opaque
          stringData:
            admin-user: admin
            admin-password: admin
        - apiVersion: v1
          kind: Secret
          metadata:
            name: library-secrets
            namespace: library
          type: Opaque
          stringData:
            POSTGRES_PASSWORD: "{{ lookup('env', 'POSTGRES_PASSWORD') }}"
            SECRET_KEY: "{{ lookup('env', 'SECRET_KEY') }}"
        - apiVersion: v1
          kind: Secret
          metadata:
            name: ghcr-pull-secret
            namespace: library
          type: kubernetes.io/dockerconfigjson
          stringData:
            .dockerconfigjson: "{{ {'auths': {'ghcr.io': {'username': lookup('env', 'GHCR_USERNAME'), 'password': lookup('env', 'GHCR_READ_TOKEN')}}} | to_json }}"
        - apiVersion: v1
          kind: Secret
          metadata:
            name: library-gitops-repository
            namespace: argocd
            labels:
              argocd.argoproj.io/secret-type: repository
          type: Opaque
          stringData:
            type: git
            url: "{{ gitops_repo_url }}"
      no_log: true

    - name: Register app of apps
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: "{{ lookup('file', playbook_dir + '/../../gitops/bootstrap.yaml') }}"
