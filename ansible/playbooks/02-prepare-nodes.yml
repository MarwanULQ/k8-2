---
# Equivalent of hostnamectl.sh: swap, kernel modules, sysctl, containerd.
- name: Prepare nodes and configure containerd
  hosts: k8s_nodes
  become: true
  tasks:
    - name: Set hostname
      ansible.builtin.hostname:
        name: "{{ node_name }}"

    - name: Disable swap now
      ansible.builtin.command: swapoff -a
      changed_when: false

    - name: Remove swap entries from /etc/fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

    - name: Load kernel modules
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop: [overlay, br_netfilter]

    - name: Persist kernel modules
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        mode: "0644"
        content: |
          overlay
          br_netfilter

    - name: Configure Kubernetes sysctls
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-kubernetes.conf
        mode: "0644"
        content: |
          net.ipv4.ip_forward = 1
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
      notify: Apply sysctl

    - name: Install containerd and helper packages
      ansible.builtin.apt:
        name: [containerd, conntrack, socat, ipset, ebtables, ethtool]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create containerd config directory
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        mode: "0755"

    - name: Generate default containerd config (only if missing)
      ansible.builtin.shell: containerd config default > {{ containerd_config_path }}
      args:
        creates: "{{ containerd_config_path }}"
      notify: Restart containerd

    - name: Enable SystemdCgroup
      ansible.builtin.replace:
        path: "{{ containerd_config_path }}"
        regexp: '^(\s*)SystemdCgroup = false$'
        replace: '\1SystemdCgroup = true'
      notify: Restart containerd

    - name: Enable and start containerd
      ansible.builtin.systemd:
        name: containerd
        enabled: true
        state: started

    - name: Apply handlers now
      ansible.builtin.meta: flush_handlers

    - name: Verify SystemdCgroup is set
      ansible.builtin.command: grep -q 'SystemdCgroup = true' {{ containerd_config_path }}
      changed_when: false

  handlers:
    - name: Apply sysctl
      ansible.builtin.command: sysctl --system

    - name: Restart containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted
