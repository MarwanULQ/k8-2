---
- name: Install kubelet, kubeadm and kubectl
  hosts: k8s_nodes
  become: true
  tasks:
    - name: Install repository prerequisites
      ansible.builtin.apt:
        name: [apt-transport-https, ca-certificates, curl, gpg]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create /etc/apt/keyrings
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Kubernetes repo signing key
      ansible.builtin.get_url:
        url: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor_version }}/deb/Release.key"
        dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
        mode: "0644"

    - name: Add Kubernetes apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor_version }}/deb/ /"
        filename: kubernetes
        state: present
        update_cache: true

    - name: Install kubelet, kubeadm, kubectl
      ansible.builtin.apt:
        name: [kubelet, kubeadm, kubectl]
        state: present

    - name: Hold Kubernetes packages
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: [kubelet, kubeadm, kubectl]

    - name: Enable kubelet (it will crash-loop until kubeadm init/join; that is expected)
      ansible.builtin.systemd:
        name: kubelet
        enabled: true

    - name: Show kubeadm version
      ansible.builtin.command: kubeadm version -o short
      register: kubeadm_version
      changed_when: false

    - name: Report version
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: kubeadm {{ kubeadm_version.stdout }}"
