{% extends "base.html" %}
{% block content %}
  <h1>Log in</h1>
  <form method="post">
    {{ form.hidden_tag() }}
    {% for field in [form.email, form.password] %}
      <p>{{ field.label }} {{ field() }}
        {% for error in field.errors %}<span class="error">{{ error }}</span>{% endfor %}
      </p>
    {% endfor %}
    {{ form.submit() }}
  </form>
{% endblock %}
