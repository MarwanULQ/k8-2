services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: ./webapp
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql+psycopg://library:${POSTGRES_PASSWORD:-local-dev-password}@db:5432/library
      SECRET_KEY: ${SECRET_KEY:-local-dev-secret-change-me}
    depends_on:
      db:
        condition: service_healthy
    command: >-
      sh -c "flask --app wsgi db upgrade &&
      gunicorn --bind 0.0.0.0:5000 wsgi:app"

volumes:
  postgres_data:
