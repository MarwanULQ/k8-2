apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-webapp
  labels:
    app: flask-webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-webapp
  template:
    metadata:
      labels:
        app: flask-webapp
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: flask-webapp
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: flask-webapp
  labels:
    app: flask-webapp
spec:
  type: NodePort
  selector:
    app: flask-webapp
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
